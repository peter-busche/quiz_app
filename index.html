<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Quiz</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #6b7280;
    --border: #e3e6eb; --accent: #2563eb; --good: #16a34a; --bad: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b1f27; --text: #e6e8ec; --muted: #9aa3b2;
      --border: #2b313c; --accent: #60a5fa; --good: #22c55e; --bad: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .muted { color: var(--muted); font-size: .9rem; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 24px; margin-top: 20px;
  }
  .quiz-list { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
  details.set { margin-top: 24px; }
  details.set summary {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    cursor: pointer; list-style: none; font-size: 1.1rem; font-weight: 600;
    padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  details.set summary::-webkit-details-marker { display: none; }
  details.set summary::before { content: "▸"; color: var(--muted); margin-right: -4px; transition: transform .15s; }
  details.set[open] summary::before { transform: rotate(90deg); }
  details.set summary > span:first-of-type { flex: 1; }
  details.set summary .muted { font-weight: 400; }
  .empty { margin: 12px 0 0; }
  .quiz-list button {
    width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 12px;
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; font: inherit; cursor: pointer;
  }
  .quiz-list button:hover:not(:disabled) { border-color: var(--accent); }
  .quiz-list button:disabled { opacity: .45; cursor: default; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
  .label { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
  .answer { border-top: 1px dashed var(--border); margin-top: 20px; padding-top: 20px; }
  .answer a { color: var(--accent); }
  .bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 12px; }
  .bar > div { height: 100%; background: var(--accent); transition: width .2s; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; align-items: center; }
  .btn {
    font: inherit; border-radius: 8px; padding: 10px 18px; cursor: pointer;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.good { background: var(--good); border-color: var(--good); color: #fff; }
  .btn.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
  .btn.link { border: none; background: none; color: var(--muted); padding: 10px 0; }
  kbd { font-size: .75rem; opacity: .75; margin-left: 6px; }
  .score { font-size: 2.5rem; font-weight: 700; margin: 8px 0; }
  .missed { margin-top: 16px; padding-left: 20px; }
  .missed li { margin-bottom: 10px; white-space: pre-wrap; }
  label.toggle { display: inline-flex; gap: 8px; align-items: center; margin-top: 12px; cursor: pointer; }
  .options { display: grid; gap: 8px; margin-top: 20px; }
  .option {
    display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%;
    font: inherit; color: var(--text); background: var(--bg); cursor: pointer;
    border: 2px solid var(--border); border-radius: 10px; padding: 12px 14px;
  }
  .option:hover:not(:disabled) { border-color: var(--accent); }
  .option:disabled { cursor: default; }
  .option .key {
    flex: none; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center;
    font-size: .8rem; font-weight: 600; border: 1px solid var(--border); color: var(--muted);
  }
  .option .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .option.selected { border-color: var(--accent); }
  .option.selected .key { background: var(--accent); border-color: var(--accent); color: #fff; }
  .option.right { border-color: var(--good); }
  .option.right .key { background: var(--good); border-color: var(--good); color: #fff; }
  .option.wrong { border-color: var(--bad); }
  .option.wrong .key { background: var(--bad); border-color: var(--bad); color: #fff; }
  .verdict { font-weight: 600; margin-bottom: 8px; }
  .verdict.good { color: var(--good); }
  .verdict.bad { color: var(--bad); }
  .quiz-list button .meta { display: block; font-size: .8rem; color: var(--muted); margin-top: 2px; }
  .header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .saved { margin-top: 12px; }
  .good-text { color: var(--good); font-weight: 600; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-top: 20px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .stat .value { font-size: 1.5rem; font-weight: 700; }
  .table-wrap { overflow-x: auto; margin-top: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--card); }
  h2 { font-size: 1.1rem; margin: 28px 0 0; }
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<script>
const app = document.getElementById("app");
let state = {};

const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function linkify(text) {
  const safeUrl = u => /^(https?:\/\/|[\w./-]+\.pdf(#.*)?$)/i.test(u) ? u : null;
  return esc(text)
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, label, url) => {
      const u = safeUrl(url.replace(/&amp;/g, "&"));
      return u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${label}</a>` : m;
    })
    .replace(/(^|[\s>])(https?:\/\/[^\s<]+)/g, (m, pre, url) =>
      `${pre}<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const plural = (n, word) => `${n} ${word}${n === 1 ? "" : word.endsWith("z") ? "zes" : "s"}`;
const fmtDate = iso => iso ? new Date(iso).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "—";
const fmtPct = p => p == null ? "—" : `${p}%`;
const fmtDuration = s => s >= 60 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${s}s`;

async function showHome() {
  state = { view: "home" };
  const [sets, stats] = await Promise.all([
    fetch("/api/quizzes").then(r => r.json()),
    fetch("/api/stats").then(r => r.json()),
  ]);
  const shuffleOn = localStorage.getItem("shuffle") === "1";
  const closed = new Set(JSON.parse(localStorage.getItem("closedSets") || "[]"));
  const meta = name => {
    const st = stats[name];
    return st && st.attempts ? `<span class="meta">Best ${fmtPct(st.best)} · Last ${fmtPct(st.last)} · ${plural(st.attempts, "attempt")}</span>` : "";
  };
  app.innerHTML = `
    <div class="header"><h1>Study Quiz</h1><button class="btn link" id="stats">View stats →</button></div>
    <div class="muted">${plural(sets.length, "quiz set")} in <code>quizzes/</code>. Pick a quiz to start.</div>
    <label class="toggle"><input type="checkbox" id="shuffle" ${shuffleOn ? "checked" : ""}> Shuffle questions</label>
    ${sets.map(s => `
      <details class="set" data-set="${esc(s.set)}" ${closed.has(s.set) ? "" : "open"}>
        <summary>
          <span>${esc(s.title)}</span>
          <span class="muted">${plural(s.quizzes.length, "quiz")} · ${plural(s.quizzes.reduce((n, q) => n + q.count, 0), "question")}</span>
        </summary>
        ${s.quizzes.length ? `
          <ul class="quiz-list">
            ${s.quizzes.map(q => `
              <li><button data-name="${esc(q.name)}" ${q.count ? "" : "disabled"}>
                <span>${esc(q.title)}${meta(q.name)}</span>
                <span class="muted">${plural(q.count, "question")}</span>
              </button></li>`).join("")}
          </ul>`
          : `<p class="muted empty">No quizzes yet. Add <code>.md</code> files to <code>quizzes/${esc(s.set)}/</code>.</p>`}
      </details>`).join("")}`;
  document.getElementById("shuffle").onchange = e =>
    localStorage.setItem("shuffle", e.target.checked ? "1" : "0");
  app.querySelectorAll("details.set").forEach(d => d.ontoggle = () => {
    d.open ? closed.delete(d.dataset.set) : closed.add(d.dataset.set);
    localStorage.setItem("closedSets", JSON.stringify([...closed]));
  });
  app.querySelectorAll(".quiz-list button").forEach(b => b.onclick = () => startQuiz(b.dataset.name));
  document.getElementById("stats").onclick = showStats;
}

async function startQuiz(name) {
  const data = await fetch("/api/quiz?name=" + encodeURIComponent(name)).then(r => r.json());
  state = { view: "quiz", name, title: data.title, all: data.questions };
  begin(data.questions);
}

function begin(questions, mode = "full") {
  const doShuffle = document.getElementById("shuffle")?.checked ?? localStorage.getItem("shuffle") === "1";
  const ordered = doShuffle ? shuffle(questions) : questions.slice();
  Object.assign(state, {
    view: "quiz", queue: ordered, index: 0, missed: [], correct: 0,
    mode, shuffled: doShuffle, startedAt: Date.now(), answers: [],
    options: ordered.map(q => q.wrong.length
      ? shuffle([...q.correct.map(text => ({ text, ok: true })), ...q.wrong.map(text => ({ text, ok: false }))])
      : null),
  });
  resetQuestion();
  renderQuestion();
}

function resetQuestion() {
  state.revealed = false;
  state.selected = new Set();
  state.result = null;
}

const current = () => state.queue[state.index];
const currentOptions = () => state.options[state.index];
const isMultiple = () => !!currentOptions() && current().correct.length > 1;

function renderQuestion() {
  const { queue, index, revealed, title, selected } = state;
  const q = current();
  const opts = currentOptions();
  const need = q.correct.length;

  let body = "", buttons;
  if (opts) {
    body = `
      ${isMultiple() ? `<div class="muted" style="margin-top:12px">Select ${need} answers</div>` : ""}
      <div class="options">
        ${opts.map((o, i) => {
          let cls = selected.has(i) ? "selected" : "";
          if (revealed) cls = o.ok ? "right" : selected.has(i) ? "wrong" : "";
          return `<button class="option ${cls}" data-i="${i}" ${revealed ? "disabled" : ""}>
            <span class="key">${i + 1}</span><span class="body">${esc(o.text)}</span></button>`;
        }).join("")}
      </div>`;
    buttons = revealed
      ? `<button class="btn primary" id="next">Next<kbd>Enter</kbd></button>`
      : isMultiple()
        ? `<button class="btn primary" id="submit" ${selected.size === need ? "" : "disabled"}>Submit<kbd>Enter</kbd></button>`
        : "";
  } else {
    buttons = revealed
      ? `<button class="btn good" id="good">Got it<kbd>→</kbd></button>
         <button class="btn bad" id="bad">Missed it<kbd>←</kbd></button>`
      : `<button class="btn primary" id="reveal">Reveal answer<kbd>Space</kbd></button>`;
  }

  const verdict = opts && revealed
    ? `<div class="verdict ${state.result ? "good" : "bad"}">${state.result ? "Correct!" : "Not quite."}</div>` : "";

  app.innerHTML = `
    <button class="btn link" id="back">← All quizzes</button>
    <h1>${esc(title)}</h1>
    <div class="muted">Question ${index + 1} of ${queue.length} · ${state.correct} correct so far</div>
    <div class="bar"><div style="width:${(index / queue.length) * 100}%"></div></div>
    <div class="card">
      <div class="label">Question</div>
      <p class="text">${linkify(q.question)}</p>
      ${body}
      ${revealed ? `
        <div class="answer">
          ${verdict}
          <div class="label">Answer</div>
          <p class="text">${linkify(q.answer)}</p>
        </div>` : ""}
    </div>
    <div class="row">${buttons}</div>`;

  document.getElementById("back").onclick = showHome;
  app.querySelectorAll(".option").forEach(b => b.onclick = () => choose(+b.dataset.i));
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on("good", () => grade(true));
  on("bad", () => grade(false));
  on("reveal", reveal);
  on("submit", submit);
  on("next", () => grade(state.result));
}

function choose(i) {
  if (state.revealed || i >= currentOptions().length) return;
  if (!isMultiple()) {
    state.selected = new Set([i]);
    return submit();
  }
  if (state.selected.has(i)) state.selected.delete(i);
  else if (state.selected.size < current().correct.length) state.selected.add(i);
  renderQuestion();
}

function submit() {
  const opts = currentOptions();
  if (state.selected.size !== current().correct.length) return;
  state.result = opts.every((o, i) => o.ok === state.selected.has(i));
  state.revealed = true;
  renderQuestion();
}

function reveal() { state.revealed = true; renderQuestion(); }

function grade(ok) {
  const opts = currentOptions();
  state.answers.push({
    id: current().id,
    correct: ok,
    chosen: opts ? opts.filter((o, i) => state.selected.has(i)).map(o => o.text) : [],
  });
  if (ok) state.correct++; else state.missed.push(current());
  state.index++;
  resetQuestion();
  if (state.index >= state.queue.length) renderResults(); else renderQuestion();
}

async function saveAttempt() {
  const { name, mode, shuffled, startedAt, answers } = state;
  const previous = await fetch("/api/stats?name=" + encodeURIComponent(name)).then(r => r.json()).catch(() => null);
  const res = await fetch("/api/attempt", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ quiz: name, mode, shuffled, duration_sec: Math.round((Date.now() - startedAt) / 1000), questions: answers }),
  }).then(r => r.json()).catch(() => ({ error: "Could not reach the quiz server" }));
  return { previous: previous?.summary, res };
}

function renderResults() {
  state.view = "results";
  const { correct, queue, missed, title, mode, name } = state;
  const pct = Math.round((correct / queue.length) * 100);
  app.innerHTML = `
    <h1>${esc(title)}</h1>
    <div class="card">
      <div class="label">Score</div>
      <div class="score">${correct} / ${queue.length} <span class="muted">(${pct}%)</span></div>
      <div class="muted">${mode === "retry" ? "Retry of missed questions · " : ""}Time: ${fmtDuration(Math.round((Date.now() - state.startedAt) / 1000))}</div>
      <div class="saved muted" id="saved">Saving results…</div>
      ${missed.length ? `
        <div class="label" style="margin-top:16px">Missed</div>
        <ol class="missed">${missed.map(q => `<li>${esc(q.question.split("\n")[0])}</li>`).join("")}</ol>`
        : `<p>Perfect run!</p>`}
    </div>
    <div class="row">
      ${missed.length ? `<button class="btn primary" id="retry">Retry missed (${missed.length})</button>` : ""}
      <button class="btn" id="restart">Restart quiz</button>
      <button class="btn" id="home">All quizzes</button>
      <button class="btn" id="quizstats">Quiz stats</button>
    </div>`;
  if (missed.length) document.getElementById("retry").onclick = () => begin(missed, "retry");
  document.getElementById("quizstats").onclick = () => showQuizStats(name);
  saveAttempt().then(({ previous, res }) => {
    const el = document.getElementById("saved");
    if (!el) return;
    if (res.error) { el.textContent = "Couldn't save results: " + res.error; return; }
    let compare = "";
    if (mode === "full" && previous?.best != null) {
      compare = pct > previous.best ? ` · <span class="good-text">New best!</span> (previous ${previous.best}%)`
        : ` · Best so far ${previous.best}%`;
    } else if (mode === "full") {
      compare = " · First recorded attempt";
    }
    el.innerHTML = `Saved to <code>${esc(res.saved)}</code>${compare}`;
  });
  document.getElementById("restart").onclick = () => begin(state.all);
  document.getElementById("home").onclick = showHome;
}

async function showStats() {
  state = { view: "stats" };
  const [sets, stats] = await Promise.all([
    fetch("/api/quizzes").then(r => r.json()),
    fetch("/api/stats").then(r => r.json()),
  ]);
  const titles = Object.fromEntries(sets.flatMap(s => s.quizzes.map(q => [q.name, q.title])));
  const setTitles = Object.fromEntries(sets.map(s => [s.set, s.title]));
  const rows = Object.entries(stats).sort((a, b) => (b[1].last_taken || "").localeCompare(a[1].last_taken || ""));
  const totalAttempts = rows.reduce((n, [, st]) => n + st.attempts + st.retries, 0);
  const avgs = rows.filter(([, st]) => st.average != null).map(([, st]) => st.average);
  app.innerHTML = `
    <button class="btn link" id="back">← All quizzes</button>
    <h1>Stats</h1>
    <div class="muted">Stored in <code>metrics/</code> · one file per quiz</div>
    <div class="stat-grid">
      <div class="stat"><div class="label">Quizzes taken</div><div class="value">${rows.length}</div></div>
      <div class="stat"><div class="label">Attempts</div><div class="value">${totalAttempts}</div></div>
      <div class="stat"><div class="label">Avg score</div><div class="value">${avgs.length ? Math.round(avgs.reduce((a, b) => a + b, 0) / avgs.length) + "%" : "—"}</div></div>
    </div>
    ${rows.length ? `
      <div class="table-wrap"><table>
        <thead><tr><th>Quiz</th><th class="num">Attempts</th><th class="num">Last</th><th class="num">Best</th><th class="num">Avg</th><th>Last taken</th></tr></thead>
        <tbody>${rows.map(([name, st]) => {
          const set = name.includes("/") ? name.split("/")[0] : "";
          return `<tr class="clickable" data-name="${esc(name)}">
            <td>${esc(titles[name] || st.title || name)}<div class="muted">${esc(setTitles[set] || set || "Other quizzes")}</div></td>
            <td class="num">${st.attempts}${st.retries ? ` <span class="muted">+${st.retries} retry</span>` : ""}</td>
            <td class="num">${fmtPct(st.last)}</td><td class="num">${fmtPct(st.best)}</td><td class="num">${fmtPct(st.average)}</td>
            <td>${fmtDate(st.last_taken)}</td></tr>`;
        }).join("")}</tbody>
      </table></div>`
      : `<p class="card">No attempts yet. Finish a quiz and your results will show up here.</p>`}`;
  document.getElementById("back").onclick = showHome;
  app.querySelectorAll("tr.clickable").forEach(tr => tr.onclick = () => showQuizStats(tr.dataset.name));
}

async function showQuizStats(name) {
  state = { view: "stats" };
  const [data, quiz] = await Promise.all([
    fetch("/api/stats?name=" + encodeURIComponent(name)).then(r => r.json()),
    fetch("/api/quiz?name=" + encodeURIComponent(name)).then(r => r.ok ? r.json() : null),
  ]);
  const st = data.summary;
  app.innerHTML = `
    <button class="btn link" id="back">← All stats</button>
    <h1>${esc(quiz?.title || st.title || name)}</h1>
    <div class="muted"><code>metrics/${esc(name.replace(/\.md$/, ".jsonl"))}</code></div>
    <div class="stat-grid">
      <div class="stat"><div class="label">Attempts</div><div class="value">${st.attempts}</div></div>
      <div class="stat"><div class="label">Last</div><div class="value">${fmtPct(st.last)}</div></div>
      <div class="stat"><div class="label">Best</div><div class="value">${fmtPct(st.best)}</div></div>
      <div class="stat"><div class="label">Average</div><div class="value">${fmtPct(st.average)}</div></div>
    </div>
    <h2>Most missed questions</h2>
    ${data.missed.length ? `
      <div class="table-wrap"><table>
        <thead><tr><th class="num">#</th><th>Question</th><th class="num">Missed</th><th>Last time</th></tr></thead>
        <tbody>${data.missed.map(q => `<tr>
          <td class="num">${q.number ?? ""}</td><td>${esc(q.question)}</td>
          <td class="num">${q.missed} / ${q.seen}</td>
          <td>${q.last_correct ? '<span class="good-text">Correct</span>' : "Missed"}</td></tr>`).join("")}</tbody>
      </table></div>` : `<p class="muted">${st.attempts ? "No misses recorded. Nice." : "No attempts yet."}</p>`}
    <h2>History</h2>
    ${data.history.length ? `
      <div class="table-wrap"><table>
        <thead><tr><th>Date</th><th>Type</th><th class="num">Score</th><th class="num">Time</th></tr></thead>
        <tbody>${data.history.map(a => `<tr>
          <td>${fmtDate(a.timestamp)}</td><td>${a.mode === "retry" ? "Retry missed" : "Full quiz"}</td>
          <td class="num">${a.score} / ${a.total} (${a.percent}%)</td><td class="num">${fmtDuration(a.duration_sec || 0)}</td></tr>`).join("")}</tbody>
      </table></div>` : `<p class="muted">No attempts yet.</p>`}
    <div class="row">
      ${quiz ? `<button class="btn primary" id="take">Take this quiz</button>` : ""}
      <button class="btn" id="home">All quizzes</button>
    </div>`;
  document.getElementById("back").onclick = showStats;
  document.getElementById("home").onclick = showHome;
  if (quiz) document.getElementById("take").onclick = () => startQuiz(name);
}

document.addEventListener("keydown", e => {
  if (state.view !== "quiz" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (currentOptions()) {
    if (!state.revealed && /^[1-9]$/.test(e.key)) choose(+e.key - 1);
    else if (e.key === "Enter") {
      e.preventDefault();
      if (state.revealed) grade(state.result); else submit();
    }
    return;
  }
  if (!state.revealed && (e.key === " " || e.key === "Enter")) { e.preventDefault(); reveal(); }
  else if (state.revealed && (e.key === "ArrowRight" || e.key === "1")) grade(true);
  else if (state.revealed && (e.key === "ArrowLeft" || e.key === "2")) grade(false);
});

showHome();
</script>
